name: Build Windows Executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles("requirements.txt") }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests if test directory exists
        continue-on-error: true
        if: always()
        run: |
          pip install pytest
          if exist tests (
            python -m pytest tests/ -v
          ) else (
            echo "No tests directory found, skipping tests"
          )

      - name: Build executable with PyInstaller
        run: |
          pyinstaller Eghtesadino.spec

      - name: Verify build output
        run: |
          if (Test-Path "dist\Eghtesadino.exe") {
            $file = Get-Item "dist\Eghtesadino.exe"
            Write-Host "Executable found: $($file.Name), Size: $($file.Length) bytes"
          } elseif (Test-Path "dist\Eghtesadino") {
            Write-Host "One-directory build found in dist\Eghtesadino"
          } else {
            Write-Error "Build output not found in dist/"
            exit 1
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eghtesadino-windows-executable
          path: |
            dist/Eghtesadino.exe
            dist/Eghtesadino/**/*
          if-no-files-found: error
          retention-days: 30